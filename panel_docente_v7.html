<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Panel docente v7</title><style>body{font-family:system-ui;background:#f7f5f3;margin:0}main{max-width:1180px;margin:auto;padding:20px}.c{background:white;border:1px solid #ddd;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.n{font-size:1.5rem;font-weight:800}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}.scroll{overflow:auto}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><main><h1>Panel docente · Progresión 2</h1><p>Avance, calificación y dominio se mantienen separados.</p><section class='c'><input id='file' type='file' accept='.json'><p id='status'>Carga una exportación JSON para analizar respuestas.</p></section><section class='c grid'><div>Estudiantes<div class='n' id='students'>0</div></div><div>Respuestas<div class='n' id='responses'>0</div></div><div>Fichas<div class='n' id='fichas'>0</div></div><div>Preguntas<div class='n' id='questions'>0</div></div></section><section class='c'><h2>Respuestas por pregunta</h2><div class='scroll'><table><thead><tr><th>Nombre</th><th>Correo</th><th>Grupo</th><th>Ficha</th><th>Pregunta</th><th>Respuesta</th><th>Validación</th><th>Intento</th><th>P/R/M/C</th></tr></thead><tbody id='tb'></tbody></table></div></section><script>file.addEventListener('change',async()=>{try{const x=JSON.parse(await file.files[0].text()),d=Array.isArray(x)?x:(x.evidence||x.responses||[]);const g=(o,k,a='')=>o[k]??o[a]??'';students.textContent=new Set(d.map(o=>g(o,'email','Correo')||g(o,'name','Nombre')).filter(Boolean)).size;responses.textContent=d.length;fichas.textContent=new Set(d.map(o=>g(o,'ficha','Ficha')).filter(Boolean)).size;questions.textContent=new Set(d.map(o=>g(o,'itemId','PreguntaID')).filter(Boolean)).size;tb.innerHTML=d.map(o=>`<tr><td>${g(o,'name','Nombre')}</td><td>${g(o,'email','Correo')}</td><td>${g(o,'group','Grupo')}</td><td>${g(o,'ficha','Ficha')}</td><td>${g(o,'question','Pregunta')||g(o,'itemId','PreguntaID')}</td><td>${JSON.stringify(g(o,'response','Respuesta'))}</td><td>${g(o,'validation','Validacion')}</td><td>${g(o,'attempt','Intento')}</td><td>${g(o,'dimension','Dimension')}</td></tr>`).join('');status.textContent='Datos cargados: '+d.length+' respuestas.'}catch(e){status.textContent='No pude leer ese archivo.'}})</script></main></body></html>
