<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Progresión 2 · APM CETis 61</title>
<style>
:root{--navy:#123a63;--burg:#981f37;--gold:#f4bf3a;--ink:#183044;--muted:#637789;--bg:#edf2f6;--ok:#2d7d46}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.brandbar{display:flex;gap:14px;align-items:center;justify-content:space-between;background:#fff;padding:9px 5vw;border-bottom:4px solid var(--burg)}
.brandbar img{max-height:44px;max-width:29%;object-fit:contain}
header{background:linear-gradient(110deg,var(--navy),#245c8d);color:white;padding:14px 5vw;position:sticky;top:0;z-index:3;box-shadow:0 2px 12px #0003}
header b{font-size:1.15rem}header small{display:block;opacity:.9}.sessionbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}.sessionbar button{margin:0;background:#fff;color:var(--navy);padding:8px 12px}
.wrap{max-width:980px;margin:auto;padding:24px 18px 70px}.card{background:white;border-radius:20px;padding:22px;margin:18px 0;box-shadow:0 8px 26px #16324a18;border:1px solid #dfe8ef}
.hero{background:linear-gradient(135deg,#fff7e4,#e9f7ff)}h1,h2{color:var(--navy)}h1{margin:.2em 0}.tag{display:inline-block;background:var(--burg);color:#fff;padding:6px 12px;border-radius:999px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.mini{background:#f7fafc;padding:14px;border-radius:14px;border:1px solid #dce7ee;text-decoration:none;color:inherit}.mini:hover{border-color:#9fb6c8}
button{border:0;border-radius:12px;padding:11px 16px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;margin:6px 6px 6px 0}.muted{color:var(--muted)}
.route{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:8px;margin-top:12px}.route a{text-decoration:none}.route .node{padding:11px 6px;text-align:center;border-radius:12px;background:#edf3f8;color:#173b61;font-weight:800;border:2px solid transparent}.route .done{background:#e2f0d9;border-color:#6aa26f}
.version-chip{display:inline-block;background:#eef5fa;color:#173b61;border:1px solid #c9dae6;border-radius:999px;padding:5px 9px;font-size:.75rem;font-weight:800}footer{max-width:980px;margin:15px auto 40px;padding:15px 18px;color:#64798a;font-size:.82rem;text-align:center}
button:focus,a:focus{outline:3px solid var(--gold);outline-offset:3px}@media(max-width:600px){header{padding:12px 16px}.wrap{padding:14px 12px 60px}.card{padding:17px;border-radius:16px}h1{font-size:1.55rem}}
</style>
</head>
<body>
<div class="brandbar"><img src="assets/dgeti.png" alt="DGETI"><img src="assets/cetis61.jpg" alt="CETis 61"><img src="assets/stem.jpg" alt="CETis 61 STEM"></div>
<header><b>Aplicaciones del Pensamiento Matemático · CETis 61</b><small>Progresión 2 · Plataforma digital</small><div class="sessionbar"><span id="sessionWho">Verificando sesión…</span><button id="topLogout" type="button" hidden>Cerrar sesión</button></div></header>
<main class="wrap" id="appMain"><div class="card"><h2>Verificando sesión…</h2><p class="muted">Preparando la vista correspondiente a tu rol.</p></div></main>
<script src="auth_v11.js?v=14.3.7d"></script>
<script>
(()=>{
 const main=document.getElementById('appMain'), who=document.getElementById('sessionWho'), logoutBtn=document.getElementById('topLogout');
 const fs=['2.0','2.1','2.2','2.3','2.4','2.5','2.6','2.7','2.8','2.9','2.10'];
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const hrefFicha=f=>`Ficha_${f.replace('.','_')}.html`;
 function logout(){try{P2Auth.clear()}catch(e){} location.replace('login.html?v=14.3.7d')}
 logoutBtn.addEventListener('click',logout);
 function studentView(s){
   let pg={}; try{pg=JSON.parse(localStorage.getItem('cetis61_p2_progress')||'{}')}catch(e){}
   const route=fs.map(f=>`<a href="${hrefFicha(f)}"><div class="node ${pg[f]?.completed?'done':''}">${pg[f]?.completed?'✓ ':''}${f}</div></a>`).join('');
   const fichas=fs.map(f=>`<a class="mini" href="${hrefFicha(f)}"><b>Ficha ${f}</b><br>Abrir ficha →</a>`).join('');
   who.textContent=`${s.name||'Estudiante'}${s.group?' · Grupo '+s.group:''} · Estudiante`; logoutBtn.hidden=false;
   main.innerHTML=`<div class="card hero"><span class="tag">RUTA DEL ESTUDIANTE</span><h1>Medir lo inaccesible</h1><p><b>${esc(s.name||'Estudiante')}</b>${s.group?' · Grupo '+esc(s.group):''}</p><p>Continúa tu trabajo en las fichas. Esta vista no contiene herramientas docentes.</p></div><div class="card"><h2>Mi ruta de avance</h2><p>El color verde indica una ficha registrada como concluida.</p><div class="route">${route}</div></div><div class="card"><h2>Fichas de Progresión 2</h2><div class="grid">${fichas}</div></div>`;
 }
 function teacherView(s){
   const fichas=fs.map(f=>`<a class="mini" href="${hrefFicha(f)}"><b>Ficha ${f}</b><br>Abrir material →</a>`).join('');
   who.textContent=`${s.name||'Docente'} · ${s.email||''} · Docente`; logoutBtn.hidden=false;
   main.innerHTML=`<div class="card hero"><span class="tag">INICIO DOCENTE</span><h1>Panel de trabajo docente</h1><p><b>${esc(s.name||'Docente')}</b> · ${esc(s.email||'')}</p><p>Revisa evidencias y consulta materiales sin entrar a la ruta de avance del estudiante.</p></div><div class="grid"><div class="mini"><h2>Valoración de evidencias</h2><p>Panel conectado a Google Sheets y Apps Script.</p><a href="panel_docente_v14_3_7d.html"><button>Abrir panel docente</button></a></div><div class="mini"><h2>Rúbrica P/R/M/C</h2><p>Referencia coherente con la escala de valoración del panel.</p><a href="rubrica_docente.html?v=14.3.7d"><button>Ver rúbrica</button></a></div><div class="mini"><h2>Guía docente</h2><p>Orientaciones del flujo digital vigente.</p><a href="guia_docente.html?v=14.3.7d"><button>Ver guía</button></a></div></div><div class="card"><h2>Materiales de Progresión 2</h2><p>Vista de consulta docente; estos accesos no representan tu avance.</p><div class="grid">${fichas}</div></div>`;
 }
 async function init(){
   if(!window.P2Auth?.valid?.()){location.replace('login.html?return=index.html%3Fv%3D14.3.7d');return}
   let r; try{r=await P2Auth.send('me',{})}catch(e){}
   if(!r?.ok){try{P2Auth.clear()}catch(e){}location.replace('login.html?return=index.html%3Fv%3D14.3.7d');return}
   const s=r.student||{}, role=String(s.role||'').trim().toLowerCase();
   if(['docente','admin'].includes(role)){teacherView(s);return}
   if(role==='estudiante'){studentView(s);return}
   main.innerHTML='<div class="card"><b>Rol no reconocido.</b><br>Cierra la sesión e inténtalo nuevamente.</div>'; logoutBtn.hidden=false;
 }
 document.addEventListener('DOMContentLoaded',init);
})();
</script>
<footer><span class="version-chip">v14.3.7d · Control estricto por rol</span> · Progresión 2 digital · CETis 61</footer>
</body></html>
