<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel docente v11</title>
<style>body{font-family:system-ui;margin:0;background:#f6f4f2;color:#20242a}main{max-width:1180px;margin:auto;padding:20px}.card{background:white;border:1px solid #ddd;border-radius:16px;padding:18px;margin:14px 0}.filters{display:flex;gap:10px;flex-wrap:wrap}input,select,button{min-height:44px;font-size:16px}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}.scroll{overflow:auto}.warn{background:#fff7e6}</style></head><body><main>
<h1>Panel docente · v11</h1><section class="card" id="session"><p id="who">Verificando sesión…</p><button id="logout">Cerrar sesión</button></section>
<section class="card warn" id="setup" hidden><strong>Backend pendiente de configuración.</strong><p>Configure la URL de Apps Script en <code>auth_v11.js</code>. El panel no simula datos de estudiantes.</p></section>
<section class="card"><h2>Consulta de respuestas</h2><div class="filters"><label>Grupo <input id="group"></label><label>Ficha <select id="ficha"><option value="">Todas</option><option>2.0</option><option>2.1</option><option>2.2</option><option>2.3</option><option>2.4</option><option>2.5</option><option>2.6</option><option>2.7</option><option>2.8</option><option>2.9</option><option>2.10</option></select></label><label>ID pregunta <input id="item"></label><button id="load">Consultar</button></div><p id="msg" aria-live="polite"></p><div class="scroll"><table><thead id="head"></thead><tbody id="body"></tbody></table></div></section>
<script src="auth_v11.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let s=P2Auth.get();if(!P2Auth.configured())setup.hidden=false;
if(!s||!P2Auth.valid()){who.textContent='No hay una sesión docente vigente.'}else{who.textContent=(s.student?.name||s.student?.email||'Sesión')+' · '+(s.student?.role||'rol no indicado')}
logout.onclick=()=>{P2Auth.clear();location.href='login.html'};
load.onclick=async()=>{msg.textContent='Consultando…';try{let x=await P2Auth.send('teacherResponses',{group:group.value.trim(),ficha:ficha.value,itemId:item.value.trim()});if(!x.ok){msg.textContent=x.error==='FORBIDDEN'?'Esta cuenta no tiene permiso docente.':x.error;return}head.innerHTML='<tr>'+x.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>';body.innerHTML=x.rows.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('');msg.textContent=x.rows.length+' respuestas encontradas.'}catch(e){msg.textContent=P2Auth.configured()?'No fue posible consultar el servidor.':'Falta configurar el backend.'}};
</script></main></body></html>
