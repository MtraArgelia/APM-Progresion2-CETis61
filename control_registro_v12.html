<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control de registro</title><style>body{font-family:system-ui;background:#f6f4f2;margin:0}main{max-width:760px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px;margin:14px 0}button{min-height:48px;padding:10px 16px;font-size:16px;font-weight:700;border-radius:10px}.state{font-size:1.4rem;font-weight:800}</style></head><body><main><h1>Control de registro de actividades</h1><section class="card"><p>Estado actual:</p><p id="state" class="state">Consultando…</p><button id="open">Abrir registro</button> <button id="close">Cerrar registro</button><p id="msg" aria-live="polite"></p></section><section class="card"><strong>Al cerrar el registro</strong><p>El alumnado puede consultar las fichas, pero el servidor no acepta nuevas respuestas ni actualizaciones de avance. Lo ya guardado permanece intacto.</p></section><script src="auth_v11.js"></script><script>const st=document.getElementById('state'),msg=document.getElementById('msg');function paint(e){st.textContent=e==='ABIERTO'?'ABIERTO · se reciben actividades':'CERRADO · no se reciben actividades'}async function refresh(){let x=await P2Auth.send('estadoRegistro',{});if(x.ok)paint(x.estado);else msg.textContent=x.error}async function setS(e){let x=await P2Auth.send('setRegistro',{estado:e});if(x.ok){paint(x.estado);msg.textContent='Estado actualizado.'}else msg.textContent=x.error}open.onclick=()=>setS('ABIERTO');close.onclick=()=>setS('CERRADO');refresh();</script></main></body></html>
